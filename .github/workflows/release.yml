name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json
        # A tag that disagrees with the manifest would publish assets named for
        # one version under the other, and the in-app updater would look for a
        # file that does not exist.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$package" ]; then
            echo "::error::tag v$tag does not match package.json $package"
            exit 1
          fi

      - name: Checks
        run: |
          npm run check
          npm test

      - name: Build installer and portable exe
        # --publish never keeps electron-builder from trying to create the
        # release itself (it would need GH_TOKEN); the step below uploads.
        run: npm run dist -- --publish never

      - name: Checksums
        # The release notes quote these hashes, and the README asks people to
        # verify them, so generate them next to the binaries instead of by hand.
        shell: bash
        run: |
          cd dist
          sha256sum nanotimer-*-setup.exe nanotimer-*-portable.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanotimer-windows
          path: |
            dist/nanotimer-*-setup.exe
            dist/nanotimer-*-setup.exe.blockmap
            dist/nanotimer-*-portable.exe
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nanotimer-*-setup.exe
            dist/nanotimer-*-setup.exe.blockmap
            dist/nanotimer-*-portable.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
